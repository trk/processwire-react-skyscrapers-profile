name: 🚀 Feature Request
description: RFC and ideas for new features and improvements in the React Skyscrapers Profile
labels: ["enhancement"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the new feature or improvement
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: |
        A simple example of the new feature in action (include Custom Page Class, DataProvider, or React component snippet).
